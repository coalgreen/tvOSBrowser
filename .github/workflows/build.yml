name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: _Project
        run: |
          xcodebuild -list
          xcodebuild -scheme Browser -sdk appletvos -configuration Release \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build
      - name: Package IPA
        working-directory: _Project
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/*.app Payload/
          zip -r tvOSBrowser.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser
          path: _Project/tvOSBrowser.ipa
