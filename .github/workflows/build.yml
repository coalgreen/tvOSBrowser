name: Build IPA
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: _Project
        run: |
          xcodebuild -list
          xcodebuild -scheme Browser -sdk appletvos -configuration Release \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build
      - name: Package IPA
        working-directory: _Project
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/*.app Payload/
          zip -r tvOSBrowser.ipa Payload
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: _Project/tvOSBrowser.ipa
